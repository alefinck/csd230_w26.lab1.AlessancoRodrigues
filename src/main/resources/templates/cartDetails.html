<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Shopping Cart</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="container mt-4">

<div class="d-flex justify-content-between align-items-center mb-4">
    <h2>Your Shopping Cart</h2>
    <a th:href="@{/books}" class="btn btn-secondary">Continue Shopping</a>
</div>

<table class="table table-striped table-hover align-middle">
    <thead class="table-dark">
    <tr>
        <th>Item Name / Description</th>
        <th>Type</th>
        <th>Price</th>
        <th class="text-center">Action</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="product : ${cart.products}">
        <td>
                    <span th:if="${product instanceof T(csd230.lab1.entities.PublicationEntity)}"
                          th:text="${product.title}"></span>
            <span th:if="${product instanceof T(csd230.lab1.entities.TicketEntity)}"
                  th:text="${product.description}"></span>
            <span th:if="${!(product instanceof T(csd230.lab1.entities.PublicationEntity)) and !(product instanceof T(csd230.lab1.entities.TicketEntity))}"
                  th:text="${'Item #' + product.id}"></span>
        </td>
        <td th:text="${product.productType}">Type</td>
        <td th:text="${'$' + #numbers.formatDecimal(product.price, 1, 2)}">$0.00</td>
        <td class="text-center">
            <a th:href="@{/cart/remove/{bookId}(bookId=${product.id})}" class="btn btn-sm btn-danger">Remove</a>
        </td>
    </tr>
    <tr th:if="${#lists.isEmpty(cart.products)}">
        <td colspan="4" class="text-center text-muted">Your cart is empty.</td>
    </tr>
    </tbody>
</table>

</body>
</html>
