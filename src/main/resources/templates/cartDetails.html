<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Shopping Cart</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="container mt-4">

<div class="d-flex justify-content-between align-items-center mb-4">
    <h2>Your Shopping Cart</h2>
    <a th:href="@{/books}" class="btn btn-secondary">Continue Shopping</a>
</div>

<div th:if="${#lists.isEmpty(cart.products)}" class="alert alert-info">
    <p class="mb-0">Your cart is empty.</p>
</div>

<div th:unless="${#lists.isEmpty(cart.products)}">
    <table class="table table-striped table-hover align-middle">
        <thead class="table-dark">
        <tr>
            <th>Item Name / Description</th>
            <th>Type</th>
            <th>Price</th>
            <th class="text-center">Action</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="product : ${cart.products}">
            <td>
                        <span th:if="${product instanceof T(csd230.lab1.entities.PublicationEntity)}"
                              th:text="${product.title}"></span>
                <span th:if="${product instanceof T(csd230.lab1.entities.TicketEntity)}"
                      th:text="${product.description}"></span>
                <span th:if="${!(product instanceof T(csd230.lab1.entities.PublicationEntity)) and !(product instanceof T(csd230.lab1.entities.TicketEntity))}"
                      th:text="${'Item #' + product.id}"></span>
            </td>
            <td th:text="${product.productType}">Type</td>
            <td th:text="${'$' + #numbers.formatDecimal(product.price, 1, 2)}">$0.00</td>
            <td class="text-center">
                <a th:href="@{/cart/remove/{bookId}(bookId=${product.id})}" class="btn btn-sm btn-danger">Remove</a>
            </td>
        </tr>
        </tbody>
    </table>

    <div class="d-flex justify-content-end mt-3">
        <form th:action="@{/cart/checkout}" method="post">
            <button type="submit" class="btn btn-success btn-lg">Checkout</button>
        </form>
    </div>
</div>

</body>
</html>
