<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Book Details</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="container mt-4">

<div class="card">
    <div class="card-header bg-primary text-white">
        <h3 class="card-title mb-0" th:text="${book.title}">Book Title</h3>
    </div>
    <div class="card-body">
        <p class="card-text"><strong>ID:</strong> <span th:text="${book.id}">1</span></p>
        <p class="card-text"><strong>Author:</strong> <span th:text="${book.author}">Author Name</span></p>
        <p class="card-text"><strong>Price:</strong> <span th:text="${'$' + #numbers.formatDecimal(book.price, 1, 2)}">$0.00</span></p>
        <p class="card-text"><strong>Copies:</strong> <span th:text="${book.copies}">0</span></p>
    </div>
    <div class="card-footer">
        <a th:href="@{/cart/add/{bookId}(bookId=${book.id})}" class="btn btn-success me-1">Add to Cart</a>
        <a th:href="@{/books/edit/{id}(id=${book.id})}" class="btn btn-warning me-1">Edit</a>
        <a th:href="@{/books}" class="btn btn-secondary">Back to List</a>
    </div>
</div>

</body>
</html>
