<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Order Confirmation</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="container mt-4">

<div class="alert alert-success mb-4" role="alert">
    <h2 class="alert-heading">Order Confirmation</h2>
    <p class="mb-0">Thank you for your purchase!</p>
</div>

<div class="card mb-4">
    <div class="card-header bg-dark text-white">
        <h4 class="card-title mb-0">Order Summary</h4>
    </div>
    <div class="card-body">
        <p><strong>Order ID:</strong> <span th:text="${order.id}">1</span></p>
        <p><strong>Order Date:</strong> <span th:text="${#temporals.format(order.orderDate, 'yyyy-MM-dd HH:mm:ss')}">2026-10-06 10:00:00</span></p>
        <p><strong>Total Amount Paid:</strong> <span class="fw-bold text-success" th:text="${'$' + #numbers.formatDecimal(order.totalAmount, 1, 2)}">$0.00</span></p>
    </div>
</div>

<h4>Items Purchased</h4>
<table class="table table-striped table-hover align-middle">
    <thead class="table-dark">
    <tr>
        <th>Item Name / Description</th>
        <th>Type</th>
        <th>Price</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="product : ${order.products}">
        <td>
                    <span th:if="${product instanceof T(csd230.lab1.entities.PublicationEntity)}"
                          th:text="${product.title}"></span>
            <span th:if="${product instanceof T(csd230.lab1.entities.TicketEntity)}"
                  th:text="${product.description}"></span>
            <span th:if="${!(product instanceof T(csd230.lab1.entities.PublicationEntity)) and !(product instanceof T(csd230.lab1.entities.TicketEntity))}"
                  th:text="${'Item #' + product.id}"></span>
        </td>
        <td th:text="${product.productType}">Type</td>
        <td th:text="${'$' + #numbers.formatDecimal(product.price, 1, 2)}">$0.00</td>
    </tr>
    </tbody>
</table>

<div class="mt-4">
    <a th:href="@{/books}" class="btn btn-primary">Back to Book List</a>
</div>

</body>
</html>
