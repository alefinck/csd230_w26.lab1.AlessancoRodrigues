<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Edit Book</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="container mt-4">

<h2 class="mb-4">Edit Book</h2>

<form th:action="@{/books/edit/{id}(id=${book.id})}" th:object="${book}" method="post" class="col-md-6">
    <div class="mb-3">
        <label for="title" class="form-label">Title</label>
        <input type="text" id="title" th:field="*{title}" class="form-control" required />
    </div>

    <div class="mb-3">
        <label for="author" class="form-label">Author</label>
        <input type="text" id="author" th:field="*{author}" class="form-control" required />
    </div>

    <div class="mb-3">
        <label for="isbn" class="form-label">ISBN</label>
        <input type="text" id="isbn" th:field="*{isbn}" class="form-control" />
    </div>

    <div class="mb-3">
        <label for="price" class="form-label">Price</label>
        <input type="number" step="0.01" id="price" th:field="*{price}" class="form-control" required />
    </div>

    <div class="mb-3">
        <label for="copies" class="form-label">Copies</label>
        <input type="number" id="copies" th:field="*{copies}" class="form-control" required />
    </div>

    <button type="submit" class="btn btn-warning">Update Book</button>
    <a th:href="@{/books}" class="btn btn-secondary">Cancel</a>
</form>

</body>
</html>
