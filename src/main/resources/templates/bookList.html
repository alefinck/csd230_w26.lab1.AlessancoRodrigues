<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Book List</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="container mt-4">

<div class="d-flex justify-content-between align-items-center mb-4">
    <h2>Book Inventory</h2>
    <div>
        <a th:href="@{/cart}" class="btn btn-outline-secondary me-2">View Cart</a>
        <a th:href="@{/books/add}" class="btn btn-primary">Add New Book</a>
    </div>
</div>

<table class="table table-striped table-hover align-middle">
    <thead class="table-dark">
    <tr>
        <th>ID</th>
        <th>Title</th>
        <th>Author</th>
        <th>Price</th>
        <th>Copies</th>
        <th class="text-center">Actions</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="book : ${books}">
        <td th:text="${book.id}">1</td>
        <td>
            <a th:href="@{/books/{id}(id=${book.id})}" th:text="${book.title}">Sample Title</a>
        </td>
        <td th:text="${book.author}">Sample Author</td>
        <td th:text="${'$' + #numbers.formatDecimal(book.price, 1, 2)}">$0.00</td>
        <td th:text="${book.copies}">0</td>
        <td class="text-center">
            <a th:href="@{/cart/add/{bookId}(bookId=${book.id})}" class="btn btn-sm btn-success me-1">Add to Cart</a>
            <a th:href="@{/books/edit/{id}(id=${book.id})}" class="btn btn-sm btn-warning me-1">Edit</a>
            <a th:href="@{/books/delete/{id}(id=${book.id})}" class="btn btn-sm btn-danger">Delete</a>
        </td>
    </tr>
    <tr th:if="${#lists.isEmpty(books)}">
        <td colspan="6" class="text-center text-muted">No books available.</td>
    </tr>
    </tbody>
</table>

</body>
</html>
